const byId = id => document.getElementById(id);
const decode = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
let pages = null;

function show(page) {
  byId("view").srcdoc = pages[page];
}

window.addEventListener("message", event => {
  if (pages && event.source === byId("view").contentWindow &&
      (event.data === "krt:map" || event.data === "krt:dossier")) show(event.data.slice(4));
});

byId("unlock").addEventListener("submit", async event => {
  event.preventDefault();
  const input = byId("code");
  byId("enter").disabled = true;
  byId("error").textContent = "";
  try {
    if (!crypto.subtle || typeof DecompressionStream !== "function") {
      byId("error").textContent = "Откройте страницу в актуальном браузере по HTTPS.";
      return;
    }
    const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(input.value.trim()), "PBKDF2", false, ["deriveKey"]);
    const aes = {name: "AES-GCM", length: 256};
    let rawKey;
    for (const slot of envelope.slots) {
      const key = await crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: decode(slot.salt),
        iterations: envelope.iterations}, material, aes, false, ["decrypt"]);
      try {
        rawKey = await crypto.subtle.decrypt({name: "AES-GCM", iv: decode(slot.nonce)}, key, decode(slot.wrapped));
        break;
      } catch (error) {
        if (error.name !== "OperationError") throw error;
      }
    }
    if (!rawKey) {
      byId("error").textContent = "Код доступа не подошёл.";
      return;
    }
    const key = await crypto.subtle.importKey("raw", rawKey, aes, false, ["decrypt"]);
    const archive = await crypto.subtle.decrypt({name: "AES-GCM", iv: decode(envelope.nonce)}, key, decode(envelope.ciphertext));
    pages = await new Response(new Blob([archive]).stream().pipeThrough(new DecompressionStream("gzip"))).json();
    byId("login").hidden = true;
    byId("workspace").hidden = false;
    show(location.hash === "#dossier" ? "dossier" : "map");
  } catch {
    byId("error").textContent = "Не удалось открыть карту. Перезагрузите страницу и повторите вход.";
  } finally {
    input.value = "";
    byId("enter").disabled = false;
  }
});

byId("lock").addEventListener("click", () => {
  pages = null;
  byId("view").srcdoc = "";
  byId("workspace").hidden = true;
  byId("login").hidden = false;
  byId("code").focus();
});
</script>
